<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DataAnalysisAgent - ECharts</title>
    <script src="https://cdn.staticfile.org/echarts/4.3.0/echarts.min.js"></script>
    <style>body{font-family:-apple-system,Segoe UI,sans-serif;background:#fafafa;padding:16px;}</style>
</head>
<body>
<div style="text-align:center;color:#555;margin-bottom:12px;">数据分析结果（共 4 张图表）</div>
    <div id="chart_0" style="width:920px;height:520px;margin:0 auto 28px;"></div>
    <div id="chart_1" style="width:920px;height:520px;margin:0 auto 28px;"></div>
    <div id="chart_2" style="width:920px;height:520px;margin:0 auto 28px;"></div>
    <div id="chart_3" style="width:920px;height:520px;margin:0 auto 28px;"></div>
    <script type="text/javascript">
    var c0 = echarts.init(document.getElementById('chart_0'));
    var option0 = {
    title: { text: '各类居民消费价格指数月度走势（2025年6月-10月）' },
    tooltip: { trigger: 'axis' },
    legend: { top: 30, type: 'scroll' },
    grid: { left: 60, right: 30, top: 80, bottom: 40 },
    xAxis: {
        type: 'category',
        data: ['2025年6月', '2025年7月', '2025年8月', '2025年9月', '2025年10月']
    },
    yAxis: { type: 'value', name: '指数(上年同月=100)' },
    series: [
        { name: '居民消费价格指数', type: 'line', data: [100.1, 100.0, 99.6, 99.7, 100.2] },
        { name: '食品烟酒类', type: 'line', data: [100.1, 99.2, 97.5, 97.4, 98.4] },
        { name: '衣着类', type: 'line', data: [101.6, 101.7, 101.8, 101.7, 101.7] },
        { name: '居住类', type: 'line', data: [100.1, 100.1, 100.1, 100.1, 100.1] },
        { name: '生活用品及服务类', type: 'line', data: [100.7, 101.2, 101.8, 102.2, 101.9] },
        { name: '交通通信类', type: 'line', data: [96.3, 96.9, 97.6, 98.0, 98.5] },
        { name: '教育文化娱乐类', type: 'line', data: [101.0, 100.9, 101.0, 100.8, 100.9] },
        { name: '医疗保健类', type: 'line', data: [100.4, 100.5, 100.9, 101.1, 101.4] },
        { name: '其他用品及服务类', type: 'line', data: [108.1, 108.0, 108.6, 109.9, 112.8] },
        { name: '非食品', type: 'line', data: [100.1, 100.3, 100.5, 100.7, 100.9] },
        { name: '消费品', type: 'line', data: [99.8, 99.6, 99.0, 99.2, 99.8] },
        { name: '服务', type: 'line', data: [100.5, 100.5, 100.6, 100.6, 100.8] },
        { name: '不包括食品和能源', type: 'line', data: [100.7, 100.8, 100.9, 101.0, 101.2] }
    ]
};
    c0.setOption(option0);

    var c1 = echarts.init(document.getElementById('chart_1'));
    var option1 = {
    title: { text: '2025年10月各分类居民消费价格指数对比' },
    tooltip: { trigger: 'axis' },
    grid: { left: 140, right: 30, top: 40, bottom: 40 },
    xAxis: { type: 'value', name: '指数(上年同月=100)' },
    yAxis: {
        type: 'category',
        data: ['居民消费价格指数', '食品烟酒类', '衣着类', '居住类', '生活用品及服务类',
               '交通通信类', '教育文化娱乐类', '医疗保健类', '其他用品及服务类',
               '非食品', '消费品', '服务', '不包括食品和能源']
    },
    series: [{
        type: 'bar',
        data: [100.2, 98.4, 101.7, 100.1, 101.9, 98.5, 100.9, 101.4, 112.8, 100.9, 99.8, 100.8, 101.2],
        label: { show: true, position: 'right' }
    }],
    markLine: { silent: true }
};
    c1.setOption(option1);

    var c2 = echarts.init(document.getElementById('chart_2'));
    var option2 = {
    title: { text: '各月分类指数分布箱线图' },
    tooltip: { trigger: 'item' },
    grid: { left: 60, right: 30, top: 60, bottom: 40 },
    xAxis: { type: 'category', data: ['2025年6月', '2025年7月', '2025年8月', '2025年9月', '2025年10月'] },
    yAxis: { type: 'value', name: '指数(上年同月=100)' },
    series: [{
        type: 'boxplot',
        data: [
            [96.3, 100.1, 100.4, 100.7, 108.1],
            [96.9, 100.0, 100.5, 100.9, 108.0],
            [97.5, 99.6, 100.6, 101.0, 108.6],
            [97.4, 99.7, 100.7, 101.1, 109.9],
            [98.4, 100.1, 100.9, 101.4, 112.8]
        ]
    }]
};
    c2.setOption(option2);

    var c3 = echarts.init(document.getElementById('chart_3'));
    var option3 = {
    title: { text: '2025年10月综合指数同比变化（对比上年同月）' },
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    legend: { top: 30 },
    grid: { left: 60, right: 30, top: 80, bottom: 40 },
    xAxis: { type: 'category', data: ['居民消费\n价格指数', '食品烟酒', '衣着', '居住', '生活用品\n及服务', '交通通信', '教育文化\n娱乐', '医疗保健', '其他用品\n及服务'] },
    yAxis: { type: 'value', name: '同比涨幅(%)' },
    series: [
        { name: '同比涨幅(%)', type: 'bar', data: [0.2, -1.6, 1.7, 0.1, 1.9, -1.5, 0.9, 1.4, 12.8], label: { show: true, position: 'top' } }
    ]
};
    c3.setOption(option3);

    </script>
</body>
</html>
